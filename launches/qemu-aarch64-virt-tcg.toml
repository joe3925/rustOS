schema = 1
id = "qemu-aarch64-virt-tcg"
provider = "qemu"
executable = "qemu-system-aarch64"
compatible_platforms = ["aarch64-uefi"]
supported_hosts = ["windows", "macos", "linux"]

firmware_files = [
    "AAVMF_CODE.fd",
    "edk2-aarch64-code.fd",
    "edk2-arm-code.fd",
    "QEMU_EFI.fd",
    "QEMU_EFI-pflash.raw",
]

args = [
    "-m", "{memory}",
    "-cpu", "max",
    "-machine", "virt,gic-version=3,its=on,iommu=smmuv3",
    "-global", "arm-smmuv3.stage=2",
    "-accel", "tcg",
    "-smp", "{cpus}",
    "-drive", "if=pflash,format=raw,readonly=on,file={firmware}",
    "-serial", "{primary_serial}",
    "-display", "none",
    "-drive", "file={boot_image},format=raw",
    "-drive", "file={system_disk},if=none,format={system_disk_format},id=sysdisk",
    "-device", "virtio-blk-pci,drive=sysdisk,disable-legacy=on,disable-modern=off,iommu_platform=on",
]

debug_args = [
    "-S",
    "-gdb", "tcp::{gdb_port}",
]


[defaults]
memory = "1G"
cpus = "3"

[capabilities]
debug = true
lldb_metadata = true

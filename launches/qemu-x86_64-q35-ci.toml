schema = 1
id = "qemu-x86_64-q35-ci"
provider = "qemu"
executable = "qemu-system-x86_64"
compatible_platforms = ["x86_64-uefi"]
supported_hosts = ["windows", "macos", "linux"]
firmware_files = [
    "OVMF_CODE_4M.fd",
    "OVMF_X64.fd",
    "OVMF_CODE.fd",
    "edk2-x86_64-code.fd",
    "edk2-x86_64-secure-code.fd",
]
args = [
    "-m", "{memory}",
    "-cpu", "qemu64,+apic,+acpi",
    "-machine", "q35",
    "-accel", "tcg,thread=single",
    "-smp", "{cpus}",
    "-display", "none",
    "-no-reboot",
    "-device", "isa-debug-exit,iobase=0xf4,iosize=0x04",
    "-device", "amd-iommu",
    "-drive", "if=pflash,format=raw,readonly=on,file={firmware}",
    "-serial", "{primary_serial}",
    "-drive", "file={boot_image},format=raw",
    "-drive", "file={system_disk},if=none,format={system_disk_format},id=sysdisk",
    "-device", "virtio-blk-pci,drive=sysdisk,disable-legacy=on,disable-modern=off,iommu_platform=on",
]
debug_args = []
lldb_metadata_args = []


[defaults]
memory = "3G"
cpus = "1"

[capabilities]
debug = false
lldb_metadata = false

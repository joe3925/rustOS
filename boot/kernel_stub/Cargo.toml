[package]
name = "kernel_stub"
version = "0.1.0"
edition = "2024"
build = "build.rs"

[[bin]]
name = "kernel_stub"
path = "src/main.rs"

[dependencies]
goblin = { version = "0.10.0", features = [
    "pe64",
    "pe32",
], default-features = false }
kernel_abi = { path = "../../libs/kernel_abi" }

[target.'cfg(target_arch = "x86_64")'.dependencies]
bootloader_api = "=0.11.15"
x86_64 = { version = "=0.15.2", default-features = false, features = [
    "instructions",
] }

[target.'cfg(target_arch = "aarch64")'.dependencies]
bootloader-api = { git = "https://github.com/joe3925/aarch64-bootloader.git" }
aarch64-vmsa = { git = "https://github.com/joe3925/aarch64-vmsa.git" }

[build-dependencies]
kernel_abi = { path = "../../libs/kernel_abi" }
serde = { version = "1", features = ["derive"] }
toml = "0.9"

[package]
name = "rustos_boot_image"
version = "0.1.0"
edition = "2021"

[dependencies]
bootloader = { version = "=0.11.15", default-features = false, features = ["uefi"] }
fatfs = { version = "0.3.6", default-features = false, features = ["std", "alloc"] }
gpt = "3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"

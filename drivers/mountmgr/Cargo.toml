
[package]
name = "mountmgr"
version = "0.1.0"
edition = "2024"
autotests = false

[lib]
name = "mountmgr"
path = "src/lib.rs"
crate-type = ["cdylib"]
test = false

[package.metadata.rustos-driver]
configuration = "src/mountmgr.toml"

[dependencies]
kernel_api = { workspace = true }
spin = { version = "0.10" }

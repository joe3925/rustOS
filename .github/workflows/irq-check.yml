name: IRQ checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  RUSTUP_TOOLCHAIN: nightly-2026-09-17

jobs:
  discover-platforms:
    runs-on: ubuntu-latest
    outputs:
      platforms: ${{ steps.platforms.outputs.platforms }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Discover platforms
        id: platforms
        shell: bash
        run: |
          platforms="$(find platforms -maxdepth 1 -type f -name '*.toml' -printf '%f\n' | sort | jq -R -s -c 'split("\n") | map(select(length > 0))')"
          if [[ "$platforms" == "[]" ]]; then
            echo "::error::No platform definitions were found under platforms/."
            exit 1
          fi
          echo "platforms=$platforms" >> "$GITHUB_OUTPUT"

  check-platform:
    needs: discover-platforms
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        platform: ${{ fromJSON(needs.discover-platforms.outputs.platforms) }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust toolchain
        run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --component rustc-dev --component rust-src --component llvm-tools-preview

      - name: Install platform Rust targets
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          targets="$(python3 -c 'import sys, tomllib; p=tomllib.load(open(sys.argv[1], "rb")); t=p["stub"]["target"]; print(t); print(t.removesuffix("-unknown-none") + "-unknown-uefi") if p["bootloader"]["firmware"] == "uefi" else None' "platforms/$PLATFORM")"
          rustup target add --toolchain "$RUSTUP_TOOLCHAIN" $targets

      - name: Install IRQ Check
        run: |
          cargo install --locked --force --git https://github.com/joe3925/irq-check.git --tag v0.1.4 --bins irq-check
          irq-check --self-check

      - name: Check IRQ paths for ${{ matrix.platform }}
        shell: bash
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          mkdir -p target/irq-check
          cargo run --release -p xtask -- irq-check --release --platform "platforms/$PLATFORM" 2>&1 | tee "target/irq-check/${PLATFORM%.toml}.log"

      - name: Upload IRQ results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: irq-check-${{ matrix.platform }}
          path: target/irq-check
          if-no-files-found: warn
          retention-days: 14

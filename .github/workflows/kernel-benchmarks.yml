name: Kernel benchmarks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kernel-bench-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  benchmark:
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: Check out proposed commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Install QEMU and disk tooling
        run: |
          sudo apt-get update
          sudo apt-get install --yes qemu-system-x86 ovmf dosfstools gdisk

      - name: Create C drive seed image
        shell: bash
        run: |
          image="$RUNNER_TEMP/rustos-ci-seed.img"
          mount_dir="$RUNNER_TEMP/rustos-ci-mount"
          loop_device=""

          cleanup() {
            if mountpoint -q "$mount_dir"; then
              sudo umount "$mount_dir"
            fi
            if [[ -n "$loop_device" ]]; then
              sudo losetup --detach "$loop_device"
            fi
          }
          trap cleanup EXIT

          truncate -s 2G "$image"
          sgdisk --new=1:2048:0 --typecode=1:0700 --change-name=1:rustOS "$image"

          loop_device="$(sudo losetup --find --show --partscan "$image")"
          partition="${loop_device}p1"
          for _ in {1..10}; do
            [[ -b "$partition" ]] && break
            sleep 0.2
          done
          [[ -b "$partition" ]]

          sudo mkfs.vfat -F 32 -n RUSTOS "$partition"
          mkdir -p "$mount_dir"
          sudo mount "$partition" "$mount_dir"
          sudo mkdir -p \
            "$mount_dir/system/registry" \
            "$mount_dir/system/toml" \
            "$mount_dir/system/mod"
          sync

          cleanup
          trap - EXIT

      - name: Prepare base worktree
        if: github.event_name == 'pull_request'
        run: git worktree add "$RUNNER_TEMP/rustos-base" "${{ github.event.pull_request.base.sha }}"

      - name: Detect benchmark-capable base
        if: github.event_name == 'pull_request'
        id: base
        shell: bash
        run: |
          if grep -q 'kernel-bench' "$RUNNER_TEMP/rustos-base/kernel/Cargo.toml"; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "Base commit predates the benchmark runner; base comparison is skipped." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Benchmark base at 1, 2, and 4 vCPUs
        if: github.event_name == 'pull_request' && steps.base.outputs.available == 'true'
        working-directory: ${{ runner.temp }}/rustos-base
        env:
          RUSTOS_DISK: ${{ runner.temp }}/rustos-ci-seed.img
          RUSTOS_DISK_FORMAT: raw
        run: |
          cargo run --release -p xtask -- bench \
            --cpus 1,2,4 \
            --tag ci \
            --output "$GITHUB_WORKSPACE/target/bench/base/results.json"

      - name: Benchmark proposed commit at 1, 2, and 4 vCPUs
        env:
          RUSTOS_DISK: ${{ runner.temp }}/rustos-ci-seed.img
          RUSTOS_DISK_FORMAT: raw
        run: |
          cargo run --release -p xtask -- bench \
            --cpus 1,2,4 \
            --tag ci \
            --output target/bench/head/results.json

      - name: Compare base and proposed commit
        if: github.event_name == 'pull_request' && steps.base.outputs.available == 'true'
        run: |
          cargo run --release -p xtask -- bench compare \
            --base target/bench/base/results.json \
            --head target/bench/head/results.json \
            --output target/bench/comparison.md
          cat target/bench/comparison.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kernel-benchmarks
          path: |
            target/bench/**/*.json
            target/bench/**/*.md
            target/bench/**/*.log
          if-no-files-found: warn
          retention-days: 14

name: Kernel benchmarks

on:
  push:
  workflow_dispatch:
    inputs:
      accept_baseline:
        description: Accept this commit as the new trusted benchmark baseline
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

concurrency:
  group: kernel-bench-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  benchmark:
    runs-on: [self-hosted, linux, x64, rustos-bench]
    timeout-minutes: 120

    steps:
      - name: Check out proposed commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Verify benchmark host
        run: |
          qemu-system-x86_64 --version
          sgdisk --version
          dpkg-query --show --showformat='dosfstools ${Version}\n' dosfstools
          clang --version
          gh --version
          jq --version
          rustc --version
          cargo --version

      - name: Create C drive seed image
        shell: bash
        run: |
          image="$RUNNER_TEMP/rustos-ci-seed.img"
          mount_dir="$RUNNER_TEMP/rustos-ci-mount"
          loop_device=""

          cleanup() {
            if mountpoint -q "$mount_dir"; then
              sudo umount "$mount_dir"
            fi
            if [[ -n "$loop_device" ]]; then
              sudo losetup --detach "$loop_device"
            fi
          }
          trap cleanup EXIT

          truncate -s 2G "$image"
          sgdisk --new=1:2048:0 --typecode=1:0700 --change-name=1:rustOS "$image"

          loop_device="$(sudo losetup --find --show --partscan "$image")"
          partition="${loop_device}p1"
          for _ in {1..10}; do
            [[ -b "$partition" ]] && break
            sleep 0.2
          done
          [[ -b "$partition" ]]

          sudo mkfs.vfat -F 32 -n RUSTOS "$partition"
          mkdir -p "$mount_dir"
          sudo mount "$partition" "$mount_dir"
          sudo mkdir -p \
            "$mount_dir/system/registry" \
            "$mount_dir/system/toml" \
            "$mount_dir/system/mod"
          sync

          cleanup
          trap - EXIT

      - name: Download trusted baseline and previous run
        id: baselines
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          BENCH_BRANCH: ${{ github.head_ref || github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          mkdir -p target/bench/baselines

          list_runs() {
            local branch="$1"
            local status="$2"
            local encoded_branch
            encoded_branch="$(jq -rn --arg value "$branch" '$value | @uri')"
            local query="repos/${GITHUB_REPOSITORY}/actions/workflows/kernel-benchmarks.yml/runs?branch=${encoded_branch}&status=${status}&per_page=50"
            gh api "$query"
          }

          echo "trusted_available=false" >> "$GITHUB_OUTPUT"
          trusted_candidates="target/bench/baselines/trusted-candidates.txt"
          list_runs "$DEFAULT_BRANCH" completed |
            jq -r '.workflow_runs[].id' > "$trusted_candidates"
          while read -r run_id; do
            run_dir="target/bench/baselines/trusted-${run_id}"
            mkdir -p "$run_dir"
            if ! gh run download "$run_id" \
              --name kernel-benchmark-anchor \
              --dir "$run_dir"; then
              continue
            fi

            manifest="$run_dir/manifest.json"
            result="$run_dir/results.json"
            boot_image="$run_dir/boot.img"
            if [[ -f "$manifest" && -f "$result" && -f "$boot_image" ]]; then
              mkdir -p target/bench/anchor
              cp "$manifest" target/bench/anchor/manifest.json
              cp "$result" target/bench/anchor/results.json
              cp "$boot_image" target/bench/anchor/boot.img
              echo "trusted_available=true" >> "$GITHUB_OUTPUT"
              echo "trusted_run_id=$(jq -r '.run_id' "$manifest")" >> "$GITHUB_OUTPUT"
              echo "trusted_commit=$(jq -r '.commit' "$manifest")" >> "$GITHUB_OUTPUT"
              break
            fi
          done < "$trusted_candidates"

          echo "previous_available=false" >> "$GITHUB_OUTPUT"
          previous_candidates="target/bench/baselines/previous-candidates.txt"
          list_runs "$BENCH_BRANCH" completed |
            jq -r '.workflow_runs[].id' > "$previous_candidates"
          while read -r run_id; do
            run_dir="target/bench/baselines/previous-${run_id}"
            mkdir -p "$run_dir"
            if ! gh run download "$run_id" \
              --name kernel-benchmarks \
              --dir "$run_dir"; then
              continue
            fi

            result="$(find "$run_dir" -path '*/head/results.json' -print -quit)"
            boot_image="$(find "$run_dir" -path '*/head/boot.img' -print -quit)"
            if [[ -n "$result" && -n "$boot_image" ]] &&
              jq -e 'all(.runs[]; .complete and .status == "passed")' "$result" >/dev/null; then
              cp "$boot_image" target/bench/previous-boot.img
              echo "previous_available=true" >> "$GITHUB_OUTPUT"
              echo "previous_run_id=$run_id" >> "$GITHUB_OUTPUT"
              break
            fi
          done < "$previous_candidates"

      - name: Benchmark proposed commit at 1, 2, and 4 vCPUs
        env:
          RUSTOS_DISK: ${{ runner.temp }}/rustos-ci-seed.img
          RUSTOS_DISK_FORMAT: raw
          TRUSTED_AVAILABLE: ${{ steps.baselines.outputs.trusted_available }}
          PREVIOUS_AVAILABLE: ${{ steps.baselines.outputs.previous_available }}
        run: |
          cargo run --release -p xtask -- bench \
            --tag ci \
            --prepare-only \
            --export-boot-image target/bench/head/boot.img

          run_variant() {
            local variant="$1"
            local boot_image="$2"
            mkdir -p "target/bench/${variant}"
            cargo run --release -p xtask -- bench \
              --cpus 1,2,4 \
              --boot-image "$boot_image" \
              --boot-timeout-secs 120 \
              --output "target/bench/${variant}/results.json"
          }

          if [[ "$TRUSTED_AVAILABLE" == "true" ]]; then
            run_variant trusted target/bench/anchor/boot.img
          fi
          run_variant head target/bench/head/boot.img
          if [[ "$PREVIOUS_AVAILABLE" == "true" ]]; then
            run_variant previous target/bench/previous-boot.img
          fi

      - name: Compare benchmark results
        shell: bash
        env:
          TRUSTED_AVAILABLE: ${{ steps.baselines.outputs.trusted_available }}
          TRUSTED_RUN_ID: ${{ steps.baselines.outputs.trusted_run_id }}
          TRUSTED_COMMIT: ${{ steps.baselines.outputs.trusted_commit }}
          PREVIOUS_AVAILABLE: ${{ steps.baselines.outputs.previous_available }}
          PREVIOUS_RUN_ID: ${{ steps.baselines.outputs.previous_run_id }}
          ACCEPT_BASELINE: ${{ github.event_name == 'workflow_dispatch' && inputs.accept_baseline }}
        run: |
          set +e
          status=0

          {
            echo "# Kernel benchmark results"
            echo
            echo "Current commit: \`${GITHUB_SHA}\`"
            echo
          } >> "$GITHUB_STEP_SUMMARY"

          if [[ "$TRUSTED_AVAILABLE" == "true" ]]; then
            cargo run --release -p xtask -- bench compare \
              --base target/bench/trusted/results.json \
              --head target/bench/head/results.json \
              --output target/bench/comparison-trusted.md \
              --title "Against trusted baseline (\`$TRUSTED_COMMIT\`, accepted by run \`$TRUSTED_RUN_ID\`)"
            trusted_status=$?
            cat target/bench/comparison-trusted.md >> "$GITHUB_STEP_SUMMARY"
            if (( trusted_status != 0 )); then
              status=1
            fi
          else
            {
              echo "## Against trusted baseline"
              echo
              echo "No trusted baseline has been accepted yet. Dispatch this workflow with \`accept_baseline\` enabled to create one."
              echo
            } >> "$GITHUB_STEP_SUMMARY"
          fi

          if [[ "$PREVIOUS_AVAILABLE" == "true" ]]; then
            cargo run --release -p xtask -- bench compare \
              --base target/bench/previous/results.json \
              --head target/bench/head/results.json \
              --output target/bench/comparison-previous.md \
              --title "Against previous run (\`$PREVIOUS_RUN_ID\`, diagnostic only)" \
              --no-annotations
            cat target/bench/comparison-previous.md >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "## Against previous run"
              echo
              echo "No prior compatible benchmark run was found for this branch."
              echo
            } >> "$GITHUB_STEP_SUMMARY"
          fi

          if [[ "$ACCEPT_BASELINE" == "true" ]]; then
            status=0
          fi
          exit "$status"

      - name: Accept this run as the trusted baseline
        if: always() && github.event_name == 'workflow_dispatch' && inputs.accept_baseline
        shell: bash
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [[ "$GITHUB_REF_NAME" != "$DEFAULT_BRANCH" ]]; then
            echo "::error::A trusted benchmark baseline can only be accepted from the default branch ($DEFAULT_BRANCH)."
            exit 1
          fi
          jq -e 'all(.runs[]; .complete and .status == "passed")' \
            target/bench/head/results.json >/dev/null
          mkdir -p target/bench/anchor
          cp target/bench/head/results.json target/bench/anchor/results.json
          cp target/bench/head/boot.img target/bench/anchor/boot.img
          jq -n \
            --arg run_id "$GITHUB_RUN_ID" \
            --arg commit "$GITHUB_SHA" \
            --arg accepted_at "$(date --utc --iso-8601=seconds)" \
            '{schema: 1, run_id: $run_id, commit: $commit, accepted_at: $accepted_at}' \
            > target/bench/anchor/manifest.json

      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kernel-benchmarks
          path: |
            target/bench/**/*.json
            target/bench/**/*.md
            target/bench/**/*.log
            target/bench/head/boot.img
          if-no-files-found: warn
          retention-days: 14

      - name: Upload trusted benchmark baseline
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kernel-benchmark-anchor
          path: target/bench/anchor
          if-no-files-found: ignore
          retention-days: 90

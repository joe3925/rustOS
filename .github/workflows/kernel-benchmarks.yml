name: Kernel benchmarks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: kernel-bench-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  benchmark:
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: Check out proposed commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Install QEMU and disk tooling
        run: |
          sudo apt-get update
          sudo apt-get install --yes qemu-system-x86 ovmf dosfstools gdisk

      - name: Create C drive seed image
        shell: bash
        run: |
          image="$RUNNER_TEMP/rustos-ci-seed.img"
          mount_dir="$RUNNER_TEMP/rustos-ci-mount"
          loop_device=""

          cleanup() {
            if mountpoint -q "$mount_dir"; then
              sudo umount "$mount_dir"
            fi
            if [[ -n "$loop_device" ]]; then
              sudo losetup --detach "$loop_device"
            fi
          }
          trap cleanup EXIT

          truncate -s 2G "$image"
          sgdisk --new=1:2048:0 --typecode=1:0700 --change-name=1:rustOS "$image"

          loop_device="$(sudo losetup --find --show --partscan "$image")"
          partition="${loop_device}p1"
          for _ in {1..10}; do
            [[ -b "$partition" ]] && break
            sleep 0.2
          done
          [[ -b "$partition" ]]

          sudo mkfs.vfat -F 32 -n RUSTOS "$partition"
          mkdir -p "$mount_dir"
          sudo mount "$partition" "$mount_dir"
          sudo mkdir -p \
            "$mount_dir/system/registry" \
            "$mount_dir/system/toml" \
            "$mount_dir/system/mod"
          sync

          cleanup
          trap - EXIT

      - name: Download previous benchmark
        id: baseline
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          BENCH_BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          mkdir -p target/bench/previous

          while read -r run_id; do
            run_dir="target/bench/previous/$run_id"
            mkdir -p "$run_dir"
            if ! gh run download "$run_id" \
              --name kernel-benchmarks \
              --dir "$run_dir"; then
              continue
            fi

            result="$(find "$run_dir" -path '*/head/results.json' -print -quit)"
            if [[ -n "$result" ]]; then
              cp "$result" target/bench/previous-results.json
              echo "available=true" >> "$GITHUB_OUTPUT"
              echo "Comparing against previous workflow run $run_id." >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
          done < <(
            gh run list \
              --workflow kernel-benchmarks.yml \
              --branch "$BENCH_BRANCH" \
              --status completed \
              --limit 20 \
              --json databaseId \
              --jq '.[].databaseId'
          )

          echo "available=false" >> "$GITHUB_OUTPUT"
          echo "No previous completed benchmark with a compatible report exists yet for \`$BENCH_BRANCH\`." >> "$GITHUB_STEP_SUMMARY"

      - name: Benchmark proposed commit at 1, 2, and 4 vCPUs
        env:
          RUSTOS_DISK: ${{ runner.temp }}/rustos-ci-seed.img
          RUSTOS_DISK_FORMAT: raw
        run: |
          cargo run --release -p xtask -- bench \
            --cpus 1,2,4 \
            --tag ci \
            --boot-timeout-secs 120 \
            --output target/bench/head/results.json

      - name: Compare with previous benchmark
        if: steps.baseline.outputs.available == 'true'
        shell: bash
        run: |
          set +e
          cargo run --release -p xtask -- bench compare \
            --base target/bench/previous-results.json \
            --head target/bench/head/results.json \
            --output target/bench/comparison.md
          status=$?
          cat target/bench/comparison.md >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kernel-benchmarks
          path: |
            target/bench/**/*.json
            target/bench/**/*.md
            target/bench/**/*.log
          if-no-files-found: warn
          retention-days: 14

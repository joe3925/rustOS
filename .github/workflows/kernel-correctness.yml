name: Kernel correctness

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  correctness:
    name: Correctness (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: [self-hosted, linux, x64, rustos-bench]
            platform: x86_64-uefi
            launch: qemu-x86_64-q35-ci
          - arch: aarch64
            runner: ubuntu-24.04
            platform: aarch64-uefi
            launch: qemu-aarch64-virt-tcg

    steps:
      - name: Check out proposed commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          submodules: recursive

      - name: Enable KVM access
        if: matrix.arch == 'x86_64'
        shell: bash
        run: |
          sudo chmod 666 /dev/kvm
          ls -l /dev/kvm

      - name: Verify correctness host
        if: matrix.arch == 'x86_64'
        shell: bash
        run: |
          qemu-system-x86_64 --version
          if [[ ! -c /dev/kvm || ! -r /dev/kvm || ! -w /dev/kvm ]]; then
            echo "::error::The runner account must have read and write access to /dev/kvm."
            exit 1
          fi
          printf 'quit\n' | timeout 15s qemu-system-x86_64 \
            -machine q35,kernel-irqchip=on \
            -accel kvm \
            -cpu host \
            -smp 4 \
            -m 128M \
            -device amd-iommu,intremap=off \
            -display none -serial none -monitor stdio -S
          sgdisk --version
          dpkg-query --show --showformat='dosfstools ${Version}\n' dosfstools
          clang --version
          gh --version
          jq --version
          rustc --version
          cargo --version

      - name: Install and verify ARM emulation
        if: matrix.arch == 'aarch64'
        shell: bash
        run: bash .github/scripts/prepare-arm-runner.sh

      - name: Create C drive seed image
        shell: bash
        run: bash .github/scripts/create-ci-disk.sh

      - name: Run correctness at 1, 2, and 4 vCPUs
        env:
          RUSTOS_DISK: ${{ runner.temp }}/rustos-ci-seed.img
          RUSTOS_DISK_FORMAT: raw
        run: |
          cargo run --release -p xtask -- correctness \
            --platform "${{ matrix.platform }}" \
            --launch "${{ matrix.launch }}" \
            --cpus 1,2,4 \
            --boot-timeout-secs 600 \
            --timeout-secs 1200 \
            --output "target/correctness/${{ matrix.arch }}/results.json"

      - name: Upload correctness results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kernel-correctness-${{ matrix.arch }}
          path: |
            target/correctness/**/*.json
            target/correctness/**/*.log
          if-no-files-found: warn
          retention-days: 14

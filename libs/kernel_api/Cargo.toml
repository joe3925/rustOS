cargo-features = ["profile-rustflags"]

[package]
name = "kernel_api"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["rlib"]

[dependencies]
acpi = "5.0.0"
spin = "0.10.0"
kernel_macros = { path = "../kernel_macros" }
kernel_types = { path = "../kernel_types", default-features = false }
kernel_sys = { path = "../kernel_sys" }
kernel_routing = { path = "../kernel_routing" }
libm = { version = "0.2", default-features = false }

[features]
default = []
[profile.dev]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
debug = true

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
debug = true

cargo-features = ["profile-rustflags"]

[package]
name = "kernel_sync"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["rlib"]

[dependencies]
crossbeam-queue = { version = "0.3.12", default-features = false, features = [
    "alloc",
] }
futures-core = { version = "0.3.32", default-features = false }
spin = "0.10"
portable-atomic = "1"
loom = { version = "0.7", optional = true, features = ["futures"] }

[features]
default = ["std"]
std = []
loom = ["std", "dep:loom"]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(loom)'] }

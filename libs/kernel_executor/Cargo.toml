cargo-features = ["profile-rustflags"]

[package]
name = "kernel_executor"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[lib]
crate-type = ["rlib"]

[dependencies]
crossbeam-queue = { version = "0.3.12", default-features = false, features = ["alloc"], optional = true }
futures-core = { version = "0.3.32", default-features = false, optional = true }
kernel_sync = { path = "../kernel_sync", default-features = false, optional = true }
spin = { version = "0.10", optional = true }
loom = { version = "0.7", features = ["futures"], optional = true }

[features]
default = ["executor"]
hosted = ["executor"]
executor = ["dep:kernel_sync", "dep:spin", "dep:crossbeam-queue", "dep:futures-core"]
loom = ["executor", "dep:loom"]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(loom)', 'cfg(irq_check)'] }

[dev-dependencies]
threadpool = "1.8"
tokio = { version = "1.45", features = [
    "io-util",
    "net",
    "rt-multi-thread",
    "sync",
] }

[profile.dev]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
debug = true

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
debug = true

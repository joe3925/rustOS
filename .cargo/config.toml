[unstable]
bindeps = true
json-target-spec = true
profile-rustflags = true

[target.x86_64-unknown-none]
rustflags = ["-C", "code-model=large"]

[target.x86_64-rustos-kernel]
linker = "rust-lld"
rustflags = ["-Clinker-plugin-lto", "-Clto=fat", "-Clink-arg=/opt:lldlto=3"]

[target.aarch64-rustos-kernel]
linker = "rust-lld"
rustflags = ["-Clinker-plugin-lto", "-Clto=fat", "-Clink-arg=/opt:lldlto=3"]

[target.'cfg(target_arch = "aarch64")']
rustflags = ["--cfg", "portable_atomic_no_outline_atomics"]

[profile.dev.package.kernel]
rustflags = ["-C", "panic=abort"]

[profile.release.package.kernel]
rustflags = ["-C", "panic=abort"]
